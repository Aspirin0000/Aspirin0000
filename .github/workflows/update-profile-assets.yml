name: Update profile assets

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-profile-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate SVG cards (stats + featured project)
        run: node scripts/update-profile-assets.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: Aspirin0000
          ZHOULI_VIDEO_URL: "https://www.bilibili.com/video/BV12a7N6qE1g/"
          ZHOULI_ACTIVE_USERS_SOURCE: "cloudflare"
          CLOUDFLARE_ANALYTICS_START_DATE: "06-22"
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ANALYTICS_DAYS: "30"
          # Optional: keep a manual value for users if you prefer.
          # ZHOULI_ACTIVE_USERS: "250k+"

      - name: Commit refreshed cards
        run: |
          if [ -z "$(git status --porcelain README.md assets/*.svg)" ]; then
            echo "No profile card changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/*.svg
          git commit -m "Update generated profile cards"
          git fetch origin main
          git pull --rebase origin main
          git push
